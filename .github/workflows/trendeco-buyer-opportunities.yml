name: TrendEco Buyer Opportunities
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/buyer_opportunities.py
      - uses: actions/upload-artifact@v4
        with:
          name: buyer-opportunities
          path: output/buyer-opportunities.*
          retention-days: 30

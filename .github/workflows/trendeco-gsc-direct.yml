name: TrendEco direct Search Console data
on:
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Fetch Search Console queries
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_TRENDECO: ${{ vars.GSC_SITE_TRENDECO }}
          GSC_SITE_POLMECH: ${{ vars.GSC_SITE_POLMECH }}
          GSC_SITE_WIDIA: ${{ vars.GSC_SITE_WIDIA }}
        run: python scripts/gsc_direct_fetch.py
      - name: Analyze queries for each brand
        run: |
          for brand in trendeco polmech widia; do
            if test -f "data/gsc_${brand}.csv"; then
              GSC_CSV="data/gsc_${brand}.csv" python scripts/buyer_opportunities.py
              cp output/buyer-opportunities.md "output/buyer-opportunities-${brand}.md"
              cp output/buyer-opportunities.json "output/buyer-opportunities-${brand}.json"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-gsc-analysis
          path: output/
          retention-days: 14

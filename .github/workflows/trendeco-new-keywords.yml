name: TrendEco new keyword discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '42 7 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover_new_keywords.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-keyword-ideas
          path: output/new-keywords.*
          retention-days: 30
